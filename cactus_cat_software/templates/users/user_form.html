{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Update Profile{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row">
    <div class="col-lg-6 mx-auto">
      <h1 class="display-5 fw-bold mb-4">Update Your Information</h1>

      <div class="card">
        <div class="card-body">
          <form method="post" action="{% url 'users:update' %}">
            {% csrf_token %}
            {{ form|crispy }}
            <div class="d-grid gap-2 mt-4">
              <button type="submit" class="btn btn-primary">Save Changes</button>
              <a href="{% url 'projects:dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
