{% load static %}

<div class="col-md-6 col-lg-4">
  <div class="card service-card h-100">
    {% if service.image %}
      <img src="{{ service.image.url }}" class="card-img-top" alt="{{ service.name }}">
    {% endif %}
    <div class="card-body d-flex flex-column">
      <h3 class="h4 card-title">{{ service.name }}</h3>
      <p class="text-muted">{{ service.short_description }}</p>

      {% if service.features %}
        <ul class="features-list mb-4">
          {% for feature in service.get_features_list %}
            <li>{{ feature }}</li>
          {% endfor %}
        </ul>
      {% endif %}

      <div class="mt-auto">
        <div class="d-grid gap-2">
          <a href="{% url 'contact' %}" class="btn btn-primary w-100">
            <i class="bi bi-calendar2-check me-2"></i>Book a Meeting
          </a>
          <form method="post" action="{% url 'orders:cart_add' service.id %}" class="add-to-cart-form">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-primary w-100">
              <i class="bi bi-clipboard-plus me-2"></i>Add to Quote
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
