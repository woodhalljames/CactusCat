volumes:
  cactus_cat_software_local_postgres_data: {}
  cactus_cat_software_local_postgres_data_backups: {}
  cactus_cat_software_local_redis_data: {}

networks:
  traefik-public:
    name: traefik-public
    driver: bridge
  default:
    driver: bridge

services:
  traefik:
    image: traefik:v3.0
    container_name: cactus_cat_software_local_traefik
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=traefik-public"
      - "--entrypoints.web.address=:8081"
      - "--log.level=INFO"
    ports:
      - "8081:8081"   # Traefik web entrypoint (client previews)
      - "8082:8080"   # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik-public
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.localhost`)"
      - "traefik.http.services.traefik.loadbalancer.server.port=8080"

  django: &django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: cactus_cat_software_local_django
    container_name: cactus_cat_software_local_django
    depends_on:
      - postgres
      - redis
      - mailpit
      - traefik
    volumes:
      - /app/.venv
      - .:/app:z
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Docker SDK access
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
    ports:
      - '8000:8000'
    networks:
      - traefik-public
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.django.rule=Host(`localhost`) && !PathPrefix(`/{path:[a-z0-9-]+-preview}`)"
      - "traefik.http.routers.django.entrypoints=web"
      - "traefik.http.services.django.loadbalancer.server.port=8000"
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: cactus_cat_software_production_postgres
    container_name: cactus_cat_software_local_postgres
    volumes:
      - cactus_cat_software_local_postgres_data:/var/lib/postgresql/18/docker
      - cactus_cat_software_local_postgres_data_backups:/backups
    env_file:
      - ./.envs/.local/.postgres

  mailpit:
    image: docker.io/axllent/mailpit:latest
    container_name: cactus_cat_software_local_mailpit
    ports:
      - "8025:8025"

  redis:
    image: docker.io/redis:7.2
    container_name: cactus_cat_software_local_redis
    volumes:
      - cactus_cat_software_local_redis_data:/data

  celeryworker:
    <<: *django
    image: cactus_cat_software_local_celeryworker
    container_name: cactus_cat_software_local_celeryworker
    depends_on:
      - redis
      - postgres
      - mailpit
    ports: []
    labels: []  # Remove Traefik labels for worker
    volumes:
      - /app/.venv
      - .:/app:z
      - /var/run/docker.sock:/var/run/docker.sock  # Docker SDK access (rw for builds)
    networks:
      - traefik-public  # Needs access to start containers on this network
      - default
    command: /start-celeryworker

  celerybeat:
    <<: *django
    image: cactus_cat_software_local_celerybeat
    container_name: cactus_cat_software_local_celerybeat
    depends_on:
      - redis
      - postgres
      - mailpit
    ports: []
    command: /start-celerybeat

  flower:
    <<: *django
    image: cactus_cat_software_local_flower
    container_name: cactus_cat_software_local_flower
    ports:
      - '5555:5555'
    command: /start-flower
