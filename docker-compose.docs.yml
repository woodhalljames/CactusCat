services:
  docs:
    image: cactus_cat_software_local_docs
    container_name: cactus_cat_software_local_docs
    build:
      context: .
      dockerfile: ./compose/local/docs/Dockerfile
    env_file:
      - ./.envs/.local/.django
    volumes:
      - /app/.venv
      - ./docs:/docs:z
      - ./config:/app/config:z
      - ./cactus_cat_software:/app/cactus_cat_software:z
    ports:
      - '9000:9000'
    command: /start-docs
